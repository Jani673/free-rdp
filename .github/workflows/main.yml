
name: Tailscale Connection Test

on:
  workflow_dispatch:

jobs:
  tailscale-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force

          if ($process.ExitCode -ne 0) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed successfully."

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing or empty."
          }

          if (-not $env:TAILSCALE_AUTH_KEY.StartsWith("tskey-auth-")) {
              throw "Auth key format is incorrect."
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
              throw "Tailscale executable not found."
          }

          & $tsExe up "--auth-key=$env:TAILSCALE_AUTH_KEY" "--hostname=gh-test-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication failed."
          }

          Write-Host "Tailscale authentication successful."

          $tsIP = & $tsExe ip -4

          if ($LASTEXITCODE -ne 0 -or -not $tsIP) {
              throw "Unable to retrieve Tailscale IP."
          }

          Write-Host "Tailscale IP successfully assigned."

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify Tailscale Connection
        shell: pwsh
        run: |
          Write-Host "Checking Tailscale connection..."

          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale status check failed."
          }

          Write-Host "Tailscale connection verified."
          Write-Host "Assigned IP: $env:TAILSCALE_IP"
